<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Principal</title>
    <link rel="stylesheet" href="../css/estilos.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <script type="module" src="../js/main.js" defer></script>
  <script type="module" src="../js/menu.js"></script>
</head>
<body>
    <!--Página principal o portada de la tienda. Puede mostrar una presentación general,
     banners o productos destacados. Carga el menú común y enlaza al resto de páginas.-->
     <!-- Encabezado principal -->
  <main-header></main-header>


<div class="carousel">
  <button class="carousel-btn prev" aria-label="Imagen anterior del carrusel">❮</button>

  <div class="carousel-track">
    
  </div>

  <button class="carousel-btn next" aria-label="Imagen siguiente del carrusel">❯</button>
</div>


  <!--  Sección de productos destacados -->
  <main class="contenedor">
    <section aria-labelledby="titulo-productos-destacados">
      <h1 id="titulo-productos-destacados" class="productos-destacados">Productos destacados</h1>

      <div id="contenedor-productos" class="grid-productos" aria-live="polite">
        <!-- Aquí se insertan dinámicamente los productos desde main.js -->
      </div>
    </section>
  </main>

  <!--  Footer -->
  <footer class="footer" aria-label="Pie de página">
    <div class="info-footer">
      <p>© 2025 Tienda de Componentes. Todos los derechos reservados.</p>

      <nav aria-label="Enlaces del pie de página">
        <a href="./contacto.html">Contacto</a>
        <span aria-hidden="true">|</span>
        <a href="./acerca.html">Sobre nosotros</a>
      </nav>
    </div>
  </footer>
  <script src="../js/auth.js" defer></script>
</body>
</html>

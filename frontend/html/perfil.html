<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi perfil</title>

  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/perfil.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script type="module" src="../js/menu.js"></script>
  <script type="module" src="../js/perfil2.js" defer></script>
</head>

<body>
  <main-header></main-header>

  <div class="page-wrapper">
    <main class="contenedor perfil-contenedor" aria-labelledby="titulo-perfil">
      <section class="perfil-card" aria-labelledby="titulo-perfil">
        <div class="perfil-header">
          <div class="perfil-avatar" aria-hidden="true">👤</div>
          <div>
            <h1 id="titulo-perfil">Mi perfil</h1>
            <p class="perfil-subtitulo">Consulta tus datos de usuario y accede rápidamente a tu carrito.</p>
          </div>
        </div>

        <div class="perfil-datos" aria-label="Datos del usuario"></div>

        <div class="perfil-acciones">
          <button id="btn-ir-carrito" type="button">Ir al carrito</button>
          <button id="btn-cerrar-sesion" type="button" class="btn-secundario">Cerrar sesión</button>
          <button id="btn-editar-perfil" type="button">Editar perfil</button>
          <button id="btn-eliminar-cuenta" type="button" class="btn-secundario">Eliminar cuenta</button>

          <form id="form-editar-perfil" style="display:none;">
            <input type="text" id="edit-nombre" class="input-form" placeholder="Nombre">
            <input type="email" id="edit-email" class="input-form" placeholder="Email">
            <input type="text" id="edit-telefono" class="input-form" placeholder="Teléfono">
            <button type="button" id="btn-cancelar-edicion" class="btn-secundario boton-form-edit">Cancelar</button>
            <button type="submit" id="btn-guardar-cambios" class="boton-form-edit">Guardar cambios</button>
            <p id="mensajeEdit" class="mensaje-formulario" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </main>

    <footer class="footer" aria-label="Pie de página">
      <div class="info-footer">
        <p>© 2025 Tienda de Componentes. Todos los derechos reservados.</p>

        <nav aria-label="Enlaces del pie de página">
          <a href="./contacto.html">Contacto</a>
          <span aria-hidden="true">|</span>
          <a href="./acerca.html">Sobre nosotros</a>
        </nav>
      </div>
    </footer>
  </div>
</body>

</html>

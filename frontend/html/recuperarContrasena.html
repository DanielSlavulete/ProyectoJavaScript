<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>

    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/estilos.css" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="divJefe" aria-labelledby="titulo-recuperar">

        <h1 id="titulo-recuperar">Recuperar contraseña</h1>

        <form id="formRecuperar" class="divFormulario" aria-describedby="mensajeRecuperar" novalidate>

            <label for="correoRecuperarContrasena">Correo electrónico</label>
            <input 
                type="text" 
                id="correoRecuperarContrasena" 
                name="correo"
                placeholder="Correo electrónico"
                autocomplete="email"
                required
            >

            <button type="submit" id="botonRecuperarContrasena">
                Enviar enlace
            </button>

            <a href="#" id="reenviarCorreo">Volver a enviar el correo</a>

            <p id="mensajeRecuperar" class="mensaje-formulario" aria-live="polite"></p>

        </form>

    </div>

    <script src="../js/recuperar.js" defer></script>
</body>

</html>

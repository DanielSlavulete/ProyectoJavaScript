<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración</title>
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <script type="module" src="../js/menu.js"></script>
  <script type="module" src="../js/admin.js" defer></script>
  <script type="module" src="../js/idioma.js"></script>
</head>
<body>
  <main-header></main-header>

  <div class="page-wrapper">
    <main class="contenedor admin-contenedor" aria-labelledby="titulo-admin">
      <h1 id="titulo-admin" data-i18n="admin.title">Panel de administración</h1>

      <!-- Formulario crear/editar producto -->
      <section class="admin-form-section">
        <h2 id="form-titulo" data-i18n="admin.create">Crear producto</h2>
        <form id="form-producto">
          <input type="hidden" id="producto-id">
          <div class="campo-form">
            <label for="prod-nombre" data-i18n="admin.name">Nombre</label>
            <input type="text" id="prod-nombre" data-i18n-placeholder="admin.name" placeholder="Nombre" required>
          </div>

          <div class="campo-form">
            <label for="prod-descripcion" data-i18n="admin.description">Descripción</label>
            <input type="text" id="prod-descripcion" data-i18n-placeholder="admin.description" placeholder="Descripción" required>
          </div>

          <div class="campo-form">
            <label for="prod-imagen" data-i18n="admin.image">Imagen</label>
            <input type="text" id="prod-imagen" data-i18n-placeholder="admin.image-placeholder" placeholder="Nombre de imagen (ej: rtx4060.jpg)" required>
          </div>

          <div class="campo-form">
            <label for="prod-precio" data-i18n="admin.price">Precio</label>
            <input type="number" id="prod-precio" data-i18n-placeholder="admin.price" placeholder="Precio" required>
          </div>

          <div class="campo-form">
            <label for="prod-tipo" data-i18n="admin.type">Tipo</label>
            <input type="text" id="prod-tipo" data-i18n-placeholder="admin.type-placeholder" placeholder="Tipo (GPU, CPU, RAM...)" required>
          </div>

          <div class="campo-form prod-especificaciones">
            <label for="prod-especificaciones" data-i18n="admin.specs">Especificaciones</label>
            <textarea
              id="prod-especificaciones"
              data-i18n-placeholder="admin.specs-placeholder"
              placeholder="Especificaciones (ej:&#10;nucleos: 8&#10;frecuencia: 4.2 GHz&#10;socket: AM5)"
            ></textarea>
          </div>

          <div class="campo-form">
            <label for="prod-descuento" data-i18n="admin.discount">Descuento (%)</label>
            <input type="number" id="prod-descuento" data-i18n-placeholder="admin.discount" placeholder="Descuento (%)">
          </div>

          <div class="campo-form">
            <label for="prod-urlVideo" data-i18n="admin.video">URL del vídeo</label>
            <input type="text" id="prod-urlVideo" data-i18n-placeholder="admin.video" placeholder="URL del vídeo">
          </div>

          <div class="form-botones">
            <button type="button" class="btn-cancelar-producto" data-i18n="admin.cancel-btn">Cancelar</button>
            <button type="submit" class="btn-guardar-producto" data-i18n="admin.save-btn">Guardar producto</button>
          </div>
          <p id="mensaje-admin" class="mensaje-formulario" aria-live="polite"></p>
        </form>
      </section>

      <!-- Lista de productos -->
      <section class="admin-lista-section">
        <h2  data-i18n="admin.products">Productos</h2>
        <div id="lista-productos-admin"></div>
      </section>
    </main>

    <footer class="footer" aria-label="Pie de página">
      <div class="info-footer">
        <p data-i18n="footer.copyright">© 2025 Tienda de Componentes. Todos los derechos reservados.</p>
        <nav aria-label="Enlaces del pie de página">
          <a href="./contacto.html" data-i18n="footer.contact">Contacto</a>
          <span aria-hidden="true">|</span>
          <a href="./acerca.html" data-i18n="footer.about">Sobre nosotros</a>
        </nav>
      </div>
    </footer>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="../css/registro.css">
    <link rel="stylesheet" href="../css/estilos.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body data-solo-invitados="true"> 
    <div class="divJefe" aria-labelledby="titulo-registro">
        <div class="contenedorImagen">
            <a href="./index.html" aria-label="Volver a la página principal">
                <img src="../img/Logo.png" alt="Logo de MGS Components">
            </a>
        </div>
        <h1 id="titulo-registro" data-i18n="register.title">Crear cuenta</h1>
        <div class="">
            <form action="" id="formRegistro" class="divFormulario" aria-describedby="mensajeRegistro" novalidate>
                <label for="nombreCrearCuenta" data-i18n="register.name">Nombre completo</label>
                <input type="text" id="nombreCrearCuenta" data-i18n-placeholder="register.name" placeholder="Nombre completo" autocomplete="name" required><br>
                <label for="correoCrearCuenta" data-i18n="register.email">Correo electrónico</label>
                <input type="text" id="correoCrearCuenta" data-i18n-placeholder="register.email" placeholder="Correo electrónico" autocomplete="email" required><br>
                <label for="telefonoCrearCuenta" data-i18n="register.phone">Teléfono</label>
                <input type="text" id="telefonoCrearCuenta" data-i18n-placeholder="register.phone" placeholder="Teléfono (Ej: +34 612345678)" autocomplete="tel" required><br>
                <label for="contrasenaCrearCuenta" data-i18n="register.password">Contraseña</label>
                <input type="password" id="contrasenaCrearCuenta" data-i18n-placeholder="register.password" placeholder="Contraseña" autocomplete="new-password" required><br>
                <label for="repetirContrasena" data-i18n="register.repeat-password">Repetir contraseña</label>
                <input type="password" id="repetirContrasena" data-i18n-placeholder="register.repeat-password" placeholder="Repetir contraseña" autocomplete="new-password" required><br>
                <div id="radio" class="campo-politica">
                    <input type="checkbox" id="radioAceptarPolitica" required>
                    <label for="radioAceptarPolitica" data-i18n="register.policy">He leído y acepto la política de privacidad</label>
                </div>    
                <button type="submit" id="botonCrearCuenta" data-i18n="register.button">CREAR CUENTA</button><br>
                <p class="texto-login">
                    <span data-i18n="register.have-account">¿Ya tienes cuenta?</span>
                    <a href="./login.html" data-i18n="register.login-link">Inicia sesión</a>
                </p>
                <p id="mensajeRegistro" class="mensaje-formulario" aria-live="polite"></p>
            </form>
            <div class="btn-contenedor">
                <select id="selector-idioma" class="selector-idioma">
                    <option value="es">🇪🇸 ES</option>
                    <option value="en">🇬🇧 EN</option>
                </select>
                <button id="btn-tema" type="button" aria-label="Cambiar a modo oscuro">🌙</button>
            </div>
        </div>
    </div>
    <script type="module" src="../js/registro2.js" defer></script>
    <script src="../js/auth.js" defer></script>
</body>
</html>

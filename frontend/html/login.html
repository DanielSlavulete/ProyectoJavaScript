<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/estilos.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body data-solo-invitados="true">
    <div class="divJefe" aria-labelledby="titulo-login">
        <div class="contenedorImagen">
            <a href="./index.html" aria-label="Volver a la página principal">
                <img src="../img/Logo.png" alt="Logo de MGS Components">
            </a>
        </div>
        <h1 id="titulo-login">INICIAR SESION</h1>
        <div class="">
            <form action="" id="formLogin" class="divFormulario" aria-describedby="mensajeLogin">
                <label for="correoIniciarSesion">Correo electrónico</label>
                <input type="text" id="correoIniciarSesion" placeholder="Correo Electrónico" required> <br>
                <label for="contrasenaIniciarSesion">Contraseña</label>
                <input type="password" id="contrasenaIniciarSesion" placeholder="Contraseña" required><br>
                <a href="./recuperarContrasena.html">¿Has olvidado tu contraseña?</a><br>
                <button  type="submit" id="botonIniciarSesion">INICIAR SESION</button><br>
                <p class="texto-login">
                ¿No tienes cuenta?
                <a href="./registro.html" id="botonRegistrarse">Registrate</a>
                </p>
                <p id="mensajeLogin" class="mensaje-formulario" aria-live="polite"></p>
            </form>
        </div> 
    </div>
    <script type="module" src="../js/login2.js" defer></script>
    <script src="../js/auth.js" defer></script>
</body>
</html>

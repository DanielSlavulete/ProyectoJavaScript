<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/estilos.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body data-solo-invitados="true">
    <div class="divJefe" aria-labelledby="titulo-login">
        <div class="contenedorImagen">
            <a href="./index.html" aria-label="Volver a la página principal">
                <img src="../img/Logo.png" alt="Logo de MGS Components">
            </a>
        </div>
        <h1 id="titulo-login" data-i18n="login.title" >INICIAR SESION</h1>
        <div class="">
            <form action="" id="formLogin" class="divFormulario" aria-describedby="mensajeLogin">
                <label for="correoIniciarSesion" data-i18n="login.email">Correo electrónico</label>
                <input type="text" id="correoIniciarSesion" data-i18n-placeholder="login.email" placeholder="Correo Electrónico" autocomplete="email" required> <br>
                <label for="contrasenaIniciarSesion" data-i18n="login.password">Contraseña</label>
                <input type="password" id="contrasenaIniciarSesion" data-i18n-placeholder="login.password" placeholder="Contraseña" autocomplete="current-password" required><br>
                <a href="./recuperarContrasena.html" data-i18n="login.forgot">¿Has olvidado tu contraseña?</a><br>
                <button  type="submit" id="botonIniciarSesion" data-i18n="login.button">INICIAR SESION</button><br>
                <p class="texto-login">
                    <span data-i18n="login.no-account">¿No tienes cuenta?</span>
                    <a href="./registro.html" id="botonRegistrarse" data-i18n="login.register-link">Registrate</a>
                </p>
                <p id="mensajeLogin" class="mensaje-formulario" aria-live="polite"></p>
            </form>
            <div class="btn-contenedor">
                <select id="selector-idioma" class="selector-idioma">
                    <option value="es">🇪🇸 ES</option>
                    <option value="en">🇬🇧 EN</option>
                </select>
                <button id="btn-tema" type="button" aria-label="Cambiar a modo oscuro">🌙</button>
            </div>
        </div> 
    </div>
    <script type="module" src="../js/login2.js" defer></script>
    <script src="../js/auth.js" defer></script>
</body>
</html>
